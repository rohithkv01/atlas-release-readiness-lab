name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

jobs:
  release-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build image (validation only)
        run: docker build -t atlas-service:${{ github.ref_name }} .

      - name: Show registry token
        run: echo "Using token ${{ secrets.REGISTRY_TOKEN }}"

  production-deploy:
    needs: release-check
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy placeholder
        run: echo "Deployment step would run here after approval."
